# fabric/network/organizations/fabric-ca/ordererOrg/fabric-ca-server-config.yaml
# Fabric CA server configuration for OrdererOrg

version: 1.5.12

port: 10054

debug: false

crlsizelimit: 512000

tls:
  enabled: true
  certfile:
  keyfile:
  clientauth:
    type: noclientcert
    certfiles:

ca:
  name: ca-orderer

csr:
  cn: ca.orderer.eventchain.com
  keyrequest:
    algo: ecdsa
    size: 256
  names:
    - C: CN
      ST: Zhejiang
      L: Hangzhou
      O: OrdererOrg
      OU:
  hosts:
    - localhost
    - ca.orderer.eventchain.com
    - ca_orderer

registry:
  maxenrollments: -1
  identities:
    - name: admin
      pass: adminpw
      type: client
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"
        hf.Registrar.DelegateRoles: "*"
        hf.Revoker: true
        hf.IntermediateCA: true
        hf.GenCRL: true
        hf.Registrar.Attributes: "*"
        hf.AffiliationMgr: true

db:
  type: sqlite3
  datasource: fabric-ca-server.db
  tls:
    enabled: false

affiliations:
  orderer:
    - admin

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage:
        - cert sign
        - crl sign
      expiry: 43800h
      caconstraint:
        isca: true
        maxpathlen: 0
    tls:
      usage:
        - signing
        - key encipherment
        - server auth
        - client auth
        - key agreement
      expiry: 8760h

bccsp:
  default: SW
  sw:
    hash: SHA2
    security: 256

operations:
  listenAddress: 0.0.0.0:20054
  tls:
    enabled: false

metrics:
  provider: prometheus
